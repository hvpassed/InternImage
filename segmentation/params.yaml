# ============================================================================
# InternImage + Mask2Former 训练参数配置 (MMSeg v0.27.0)
# DVC 参数化管理 - 通过切换 dataset 参数来训练不同数据集
# ============================================================================

# 当前训练的数据集 (landcover / loveda / combined)
dataset: "landcover"

# 数据集路径配置
data_root:
  landcover: "data/landcover"
  loveda: "data/loveDA"
  combined: "data/combined"

# 类别配置 (5类)
num_classes: 5
classes:
  - "background"
  - "building"
  - "woodland"
  - "water"
  - "road"

# 类别颜色 (用于可视化)
palette:
  - [0, 0, 0]        # background - 黑色
  - [255, 0, 0]      # building - 红色
  - [0, 255, 0]      # woodland - 绿色
  - [0, 0, 255]      # water - 蓝色
  - [255, 255, 0]    # road - 黄色

# LoveDA 标签映射 (原始 -> 新标签)
# (1,5,7)->0, (2)->1, (6)->2, (4)->3, (3)->4
loveda_label_mapping:
  0: 255  # ignore
  1: 0    # background -> background
  2: 1    # building -> building
  3: 4    # road -> road
  4: 3    # water -> water
  5: 0    # barren -> background
  6: 2    # forest -> woodland
  7: 0    # agriculture -> background

# 模型配置
model:
  backbone: "internimage_h"  # internimage_t/s/b/l/xl/h
  pretrained: "pretrained/mask2former_internimage_h_ade20k.pth"
  # InternImage-H 参数
  channels: 320
  depths: [6, 6, 32, 6]
  groups: [10, 20, 40, 80]
  drop_path_rate: 0.5

# 训练配置
train:
  total_iters: 80000
  batch_size: 1          # samples_per_gpu
  num_workers: 4
  val_interval: 2000
  checkpoint_interval: 4000
  
  # 图像尺寸
  crop_size: [512, 512]
  img_scale: [2048, 512]  # 长边, 短边
  
  # 优化器
  optimizer:
    type: "AdamW"
    lr: 0.00002
    weight_decay: 0.05
    betas: [0.9, 0.999]
  
  # 学习率调度
  lr_config:
    policy: "poly"
    power: 1.0
    min_lr: 0.0
    warmup: "linear"
    warmup_iters: 1500
    warmup_ratio: 0.000001
  
  # Layer Decay (InternImage 特有)
  layer_decay_rate: 0.95

# 实验配置
experiment:
  name: "mask2former_internimage_h_5cls"
  seed: 42
  work_dir: "work_dirs"

# GPU配置
gpu:
  ids: [0]
  fp16: false  # 是否使用混合精度
