# dvc.yaml (修改版 - 移除数据准备依赖)
stages:
  # ============================================================================
  # Stage 1: 训练模型 (不再依赖 prepare)
  # ============================================================================
  train:
    cmd: >
      python scripts/train.py
      --config configs/mask2former_internimage_h_512_80k_custom5cls.py
      --dataset ${dataset}
      --work-dir ${experiment.work_dir}/${dataset}
    deps:
      - scripts/train.py
      - configs/mask2former_internimage_h_512_80k_custom5cls.py
      - pretrained/internimage_xl_22k_192to384.pth
      # - data/${dataset}/.prepared  <-- 已删除这一行，不再强制检查数据
    params:
      - dataset
      - data_root.${dataset} # 依然追踪路径参数变化
      - num_classes
      - model
      - train
      - experiment
    outs:
      - ${experiment.work_dir}/${dataset}/best_mIoU.pth:
          cache: false
    metrics:
      - ${experiment.work_dir}/${dataset}/metrics.json:
          cache: false
    # 暂时注释掉 plots 防止因为没生成 csv 而报错，等跑通了再加
    # plots:
    #   - ${experiment.work_dir}/${dataset}/train_log.csv:
    #       x: iter
    #       y: mIoU

  # ============================================================================
  # Stage 2: 评估模型
  # ============================================================================
  evaluate:
    cmd: >
      python scripts/evaluate.py
      --config configs/mask2former_internimage_h_512_80k_custom5cls.py
      --checkpoint ${experiment.work_dir}/${dataset}/best_mIoU.pth
      --dataset ${dataset}
    deps:
      - scripts/evaluate.py
      - ${experiment.work_dir}/${dataset}/best_mIoU.pth
    params:
      - dataset
      - data_root.${dataset}
    metrics:
      - ${experiment.work_dir}/${dataset}/eval_metrics.json:
          cache: false